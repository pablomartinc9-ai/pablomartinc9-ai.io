<style>
:root {
  --bg: #0A0A0C; --card: #131317; --card-hi: #18181D; --line: rgba(255,255,255,.12);
  --text: #F2F2F5; --text-dim: #A1A1AA; --text-faint: #71717A;
  --accent: #5B72F2; --accent-soft: #8FA0FF;
  --font-head: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: inherit; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.6; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 60px; }
a { color: inherit; text-decoration: none; transition: color 0.2s ease; }

/* Header & Nav */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(10,10,12,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; max-width: 860px; margin: 0 auto; }
.logo { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; }
.logo span { color: var(--accent-soft); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.lang-btn { border: 1px solid var(--line); background: transparent; color: var(--text-dim); font-family: var(--font-body); font-size: .8rem; font-weight: 500; padding: 7px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s ease; }
.lang-btn:hover { border-color: var(--accent-soft); color: var(--accent-soft); }
.nav-cta { background: var(--accent); border: 1px solid var(--accent); color: #fff; font-size: .85rem; font-weight: 500; padding: 9px 18px; border-radius: 20px; transition: all 0.2s ease; }
.nav-cta:hover { background: transparent; color: var(--accent-soft); border-color: var(--accent-soft); }
.nav-cv { background: var(--card-hi); border: 1px solid var(--line); color: var(--text); font-size: .85rem; font-weight: 500; padding: 9px 18px; border-radius: 20px; transition: all 0.2s ease; }
.nav-cv:hover { border-color: var(--text); }

/* Layout & Cards */
.section-title { font-family: var(--font-head); font-size: 1.4rem; margin: 40px 0 16px; color: var(--text); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
.card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.row { margin-top: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 680px) { .row2 { grid-template-columns: 1fr; } .nav-cv { display: none; } }

/* Photo + bio */
.top-row { display: grid; grid-template-columns: 220px 1fr; gap: 16px; margin-top: 40px; }
@media (max-width: 680px) { .top-row { grid-template-columns: 1fr; } .photo-card { min-height: 280px; } }
.photo-card { padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 220px; }
.photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bio-card { display: flex; align-items: center; }
.bio-card p { font-family: var(--font-head); font-size: 1.15rem; font-weight: 400; line-height: 1.5; color: var(--text); }
.bio-card p em { color: var(--accent-soft); font-style: normal; font-weight: 600; }

/* Interests */
.interests-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.interests-card h3 { font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
.sep { width: 1px; height: 22px; background: var(--line); }
.badge { display: flex; align-items: center; gap: 8px; background: var(--card-hi); border: 1px solid var(--line); padding: 7px 14px; border-radius: 10px; font-size: .85rem; color: var(--text-dim); }

/* Project / experience cards */
.pcard h3 { font-size: 1.15rem; font-weight: 600; font-family: var(--font-head); }
.pcard .role { color: var(--text-dim); font-size: .85rem; margin-top: 4px; font-weight: 500; }
.pcard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.date-pill { background: var(--bg); border: 1px solid var(--line); font-size: .75rem; color: var(--text-dim); padding: 5px 12px; border-radius: 20px; white-space: nowrap; font-weight: 500; }
.pcard hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.pcard ul { list-style: none; }
.pcard li { position: relative; padding-left: 18px; font-size: .85rem; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
.pcard li::before { content: '→'; position: absolute; left: 0; color: var(--accent-soft); font-weight: bold; }

/* Tool chips */
.tool-card h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }
.tool-list { display: flex; flex-wrap: wrap; gap: 10px; }
.tool { display: flex; align-items: center; gap: 8px; background: var(--card-hi); border: 1px solid var(--line); padding: 6px 12px 6px 6px; border-radius: 10px; font-size: .83rem; font-weight: 500; color: var(--text-dim); }
.tool i { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: .7rem; font-weight: 700; color: #0A0A0C; flex-shrink: 0; }

/* Languages / profiles / details */
.inline-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.inline-card h3 { font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
.lang-badge, .link-badge, .detail-badge { display: flex; align-items: center; gap: 8px; background: var(--card-hi); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-size: .85rem; color: var(--text-dim); transition: all 0.2s ease; }
a.link-badge:hover { background: var(--accent-soft); color: var(--bg); border-color: var(--accent-soft); }

footer { padding: 50px 0 20px; text-align: center; }
footer p { color: var(--text-faint); font-size: .85rem; }
footer a { color: var(--text-dim); font-weight: 500; }
footer a:hover { color: var(--accent-soft); }
</style>
